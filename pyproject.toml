[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quopt-agents"
version = "1.0.0"
description = "Reproducibility package for QuOpt-Agents: a hybrid quantum-classical multi-agent framework for cardinality-constrained portfolio optimization"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.11",
    "matplotlib>=3.8",
    "yfinance>=0.2.40",
    "tabulate>=0.9",
]

[project.optional-dependencies]
docx = ["python-docx>=1.1"]
dev = ["pytest>=8.0"]

[project.scripts]
quopt = "quopt.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
